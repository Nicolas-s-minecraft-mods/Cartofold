name: Bug
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What occurs
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new world.
        2. ...
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant part of `latest.log` or the crash report.
      render: text
  - type: textarea
    id: planning
    attributes:
      label: Planning
      description: >-
        The work in hours, and the dependencies (#12, Folkhold#597). The workflow Project copies them to the project.
        Keep one item on each line.
      value: |
        Estimate: 
        Blocked by: 
        Blocks: 
